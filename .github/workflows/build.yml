name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binary:
    name: Nuitka binary (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: spark2json-linux-x86_64
          - os: windows-latest
            artifact: spark2json-windows-x86_64
          - os: macos-latest
            artifact: spark2json-macos-arm64
          - os: macos-15-intel
            artifact: spark2json-macos-x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf ccache

      - name: Install package and Nuitka
        run: |
          uv venv --clear
          uv pip install . "nuitka>=2.4"

      - name: Build with Nuitka
        run: >
          uv run python -m nuitka
          --onefile
          --assume-yes-for-downloads
          --output-dir=dist
          --output-filename=${{ matrix.artifact }}
          --include-package=spark2json
          nuitka_main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/spark2json*
          if-no-files-found: error

  wheel:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Build wheel
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binary, wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
